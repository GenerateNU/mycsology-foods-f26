# add desired CONFIGs here
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_LED=y
CONFIG_PWM=y
CONFIG_W1=y
# DS2482-800 enables via DT (maxim,ds2482-800 @ 0x1a); keep W1 on.
# Use app sht30.c instead of Zephyr's in-tree SHT3XD sensor driver.
CONFIG_SHT3XD=n
# Custom buzzer Kconfig symbols are not in this Zephyr tree (app driver is plain PWM).
# CONFIG_BUZZER=y
# CONFIG_BUZZER_PWM=y
CONFIG_LOG=y
CONFIG_SENSOR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
